[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = collections
remote_user          = ansible
private_key_file     = ~/.ssh/bootcamp_ansible
vault_password_file  = .vault_pass
interpreter_python   = auto_silent
forks                = 10
# Labo uniquement : les « serveurs » sont recréés souvent, leurs clés d'hôte changent
host_key_checking    = False
retry_files_enabled  = False
callback_result_format = yaml
# Affiche la durée de chaque tâche en fin de run
callbacks_enabled    = ansible.posix.profile_tasks

[ssh_connection]
# pipelining : moins d'allers-retours SSH → runs beaucoup plus rapides
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
