# Inventaire statique. En cloud on utiliserait un inventaire DYNAMIQUE
# (plugins amazon.aws.aws_ec2, azure.azcollection.azure_rm…) basé sur les tags des VM.
all:
  children:
    lab:
      vars:
        ansible_host: 127.0.0.1      # les conteneurs exposent SSH sur des ports locaux différents
      children:
        web:
          hosts:
            web1:
              ansible_port: 2221
              http_host_port: 8081
            web2:
              ansible_port: 2222
              http_host_port: 8082
        db:
          hosts:
            db1:
              ansible_port: 2223
