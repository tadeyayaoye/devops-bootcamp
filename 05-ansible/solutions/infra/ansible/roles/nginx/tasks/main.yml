---
- name: Installer nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Supprimer le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

- name: Déployer le reverse proxy taskapi
  ansible.builtin.template:
    src: taskapi.conf.j2
    dest: /etc/nginx/sites-available/taskapi.conf
    mode: "0644"
  notify: Recharger nginx

- name: Activer le site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/taskapi.conf
    dest: /etc/nginx/sites-enabled/taskapi.conf
    state: link
  notify: Recharger nginx

- name: Démarrer nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
