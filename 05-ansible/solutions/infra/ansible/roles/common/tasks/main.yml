---
- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600          # idempotence : pas d'apt update à chaque run

- name: Régler le fuseau horaire
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Écrire /etc/timezone
  ansible.builtin.copy:
    content: "{{ timezone }}\n"
    dest: /etc/timezone
    mode: "0644"

- name: Créer les comptes d'administration
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: /bin/bash
    groups: sudo
    append: true
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Autoriser leur clé SSH
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ admin_public_key }}"
    exclusive: true
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Message d'accueil (motd)
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    mode: "0644"

- name: Durcir la configuration SSH
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s   # un fichier invalide n'est JAMAIS installé (pas de lock-out)
  notify: Recharger sshd
