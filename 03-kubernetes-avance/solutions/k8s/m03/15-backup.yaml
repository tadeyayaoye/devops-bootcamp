# Sauvegarde logique de la base toutes les 10 minutes (pg_dump, format custom) sur un PVC dédié.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  namespace: taskapi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: taskapi
spec:
  schedule: "*/10 * * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:17-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  f="/backups/taskapi-$(date +%Y%m%d-%H%M%S).dump"
                  pg_dump -h postgres -U taskapi -d taskapi -Fc -f "$f"
                  echo "sauvegarde OK : $f ($(du -h "$f" | cut -f1))"
                  find /backups -name '*.dump' -mmin +60 -delete   # rétention : 1 h
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: taskapi-db
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups
