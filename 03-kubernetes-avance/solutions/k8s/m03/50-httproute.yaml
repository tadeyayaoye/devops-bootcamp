# Rôle « équipe applicative » : la route vers SON service, dans SON namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskapi
  namespace: taskapi
spec:
  parentRefs:
    - name: main
      namespace: traefik
      sectionName: web
  hostnames:
    - taskapi.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: taskapi
          port: 80
