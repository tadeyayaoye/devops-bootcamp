apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskapi-prod

resources:
  - namespace.yaml
  - ../../apps/postgres/base
  - ../../apps/taskapi/base

images:
  - name: ghcr.io/tadeyayaoye/taskapi
    newName: taskapi
    newTag: dev

configMapGenerator:
  - name: taskapi-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=WARNING

patches:
  - target:
      kind: HTTPRoute
      name: taskapi
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: taskapi.localhost
  # Strategic merge patch : on ne décrit que ce qui change
  - path: patch-resources.yaml
