apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskapi
spec:
  parentRefs:
    - name: main
      namespace: traefik
      sectionName: web
  hostnames:
    - taskapi.localhost        # remplacé par chaque overlay
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: taskapi
          port: 80
