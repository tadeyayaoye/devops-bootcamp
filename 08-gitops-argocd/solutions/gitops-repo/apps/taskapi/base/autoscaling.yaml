apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskapi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskapi
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: taskapi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskapi
