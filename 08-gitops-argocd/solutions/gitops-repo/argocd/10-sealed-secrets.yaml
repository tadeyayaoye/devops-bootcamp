# Contrôleur Sealed Secrets : déchiffre dans le cluster les SealedSecret commités dans Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"      # avant les applications qui ont des secrets
spec:
  project: platform
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: "*"                      # TODO lab 8.3 : épingle la version (helm search repo sealed-secrets)
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # nom attendu par défaut par la CLI kubeseal
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
