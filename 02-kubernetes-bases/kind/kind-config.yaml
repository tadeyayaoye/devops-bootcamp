# Cluster local du bootcamp : 1 control-plane + 2 workers.
#   kind create cluster --config 02-kubernetes-bases/kind/kind-config.yaml
# Au module 04, ce fichier sera remplacé par du code Terraform.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bootcamp
nodes:
  - role: control-plane
    # Les NodePort 30080/30443 (Traefik, module 03) sont publiés sur les ports 80/443 de WSL,
    # eux-mêmes relayés sur localhost côté Windows → http://*.localhost dans ton navigateur.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
