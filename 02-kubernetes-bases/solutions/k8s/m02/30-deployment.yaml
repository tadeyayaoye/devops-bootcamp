apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
  namespace: taskapi
  labels:
    app.kubernetes.io/name: taskapi
    app.kubernetes.io/part-of: devops-bootcamp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # jamais moins de capacité pendant un déploiement
  selector:
    matchLabels:
      app.kubernetes.io/name: taskapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskapi
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: taskapi
          image: taskapi:dev            # chargée dans kind avec `kind load docker-image`
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskapi-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapi-db
                  key: password
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30        # jusqu'à 60 s pour démarrer
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi             # pas de limite CPU : on évite le throttling, la request suffit au scheduling
