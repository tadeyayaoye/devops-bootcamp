apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: web }]
  hostnames: [grafana.localhost]
  rules:
    - backendRefs: [{ name: kps-grafana, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: web }]
  hostnames: [prometheus.localhost]
  rules:
    - backendRefs: [{ name: kps-prometheus, port: 9090 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  parentRefs: [{ name: main, namespace: traefik, sectionName: web }]
  hostnames: [alertmanager.localhost]
  rules:
    - backendRefs: [{ name: kps-alertmanager, port: 9093 }]
