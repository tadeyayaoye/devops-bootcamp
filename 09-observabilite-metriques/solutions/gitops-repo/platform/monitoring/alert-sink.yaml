apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: python:3.12-alpine
          command: ["python", "-u", "/app/alert_sink.py"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: alert-sink-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
spec:
  selector:
    app.kubernetes.io/name: alert-sink
  ports:
    - name: http
      port: 8080
      targetPort: http
