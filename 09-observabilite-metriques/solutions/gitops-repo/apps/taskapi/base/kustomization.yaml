apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: devops-bootcamp
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - autoscaling.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml        # module 09

configMapGenerator:
  - name: taskapi-config
    literals:
      - APP_ENV=base
      - LOG_LEVEL=INFO
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=taskapi
      - DB_USER=taskapi
      - CHAOS_ENABLED=true
