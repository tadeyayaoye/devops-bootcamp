# Configuration de l'analyse SonarQube (lancée depuis le dossier app/)
sonar.projectKey=taskapi
sonar.projectName=taskapi
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12

# Rapports produits par l'étape de tests (pytest --cov --cov-report=xml --junitxml=…)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

sonar.exclusions=**/__pycache__/**,.venv/**
