apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskapi-prod

resources:
  - namespace.yaml
  - sealed-secret-db.yaml          # généré par 08-gitops-argocd/scripts/seal-db-secret.sh prod
  - ../../apps/postgres/base
  - ../../apps/taskapi/base

# ⚠ La prod ne change QUE par Pull Request (promotion d'un tag déjà validé en dev)
images:
  - name: ghcr.io/tadeyayaoye/taskapi
    newTag: main

configMapGenerator:
  - name: taskapi-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.observability.svc:4318
      - LOG_LEVEL=WARNING

patches:
  - target:
      kind: HTTPRoute
      name: taskapi
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: taskapi.localhost
  - path: patch-resources.yaml
