apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskapi-dev

resources:
  - namespace.yaml
  - sealed-secret-db.yaml          # généré par 08-gitops-argocd/scripts/seal-db-secret.sh dev
  - ../../apps/postgres/base
  - ../../apps/taskapi/base

# ⚠ Ce bloc est mis à jour AUTOMATIQUEMENT par la CI (kustomize edit set image) à chaque build de main
images:
  - name: ghcr.io/tadeyayaoye/taskapi
    newTag: main

configMapGenerator:
  - name: taskapi-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.observability.svc:4318
      - LOG_LEVEL=DEBUG

patches:
  - target:
      kind: HTTPRoute
      name: taskapi
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: taskapi-dev.localhost
  - target:
      kind: HorizontalPodAutoscaler
      name: taskapi
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
