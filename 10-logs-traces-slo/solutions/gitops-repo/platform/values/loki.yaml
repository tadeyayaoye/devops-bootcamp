# Loki en mode monolithique (un seul pod), stockage sur disque local.
# En production : mode distribué/simple scalable + stockage objet (S3, GCS, Azure Blob, MinIO externe).
#   helm show values grafana-community/loki | less
deploymentMode: Monolithic        # anciennes versions du chart : SingleBinary

loki:
  auth_enabled: false             # pas de multi-tenant (sinon en-tête X-Scope-OrgID obligatoire)
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 768Mi }

# Aucun composant des autres modes de déploiement
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
bloomGateway: { replicas: 0 }

# Économies de RAM pour le labo
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
