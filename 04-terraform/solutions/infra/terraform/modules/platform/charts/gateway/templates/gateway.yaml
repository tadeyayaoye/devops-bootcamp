# Rôle « équipe plateforme » : la classe de passerelle et LE point d'entrée HTTP du cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000            # = port de l'entrypoint "web" de Traefik (exposé en 80 par le Service)
      hostname: "*.localhost"
      allowedRoutes:
        namespaces:
          from: All         # toute équipe peut s'y attacher (en entreprise : from: Selector + label)
